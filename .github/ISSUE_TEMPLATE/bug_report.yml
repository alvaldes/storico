name: Reporte de error
description: Reporta un defecto en el backend o en la aplicación web de Storico
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¿Es una vulnerabilidad de seguridad? No abras un issue público:
        escribe a alvaldes.dev@gmail.com.

  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describe el defecto con claridad, sin especular sobre su causa.
      placeholder: Eliminar una historia devuelve HTTP 500.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: La secuencia más corta que muestra el defecto de forma confiable.
      placeholder: |
        1. Abre un proyecto con al menos una historia
        2. Elimina la historia
        3. Observa la respuesta
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué pasa en su lugar. Incluye el estado HTTP y los identificadores de error.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Logs, trazas, salida de consola, capturas o enlaces. Redacta secretos, tokens y hostnames privados.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: superficie
    attributes:
      label: Superficie
      description: Dónde observaste el defecto.
      options:
        - API (backend)
        - Aplicación web (frontend)
        - Ambas
        - No estoy seguro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      description: La versión en ejecución, según el tag de git, `GET /api/v1/health` o `package.json`.
      placeholder: "0.11.0"
    validations:
      required: true

  - type: dropdown
    id: como-lo-ejecutas
    attributes:
      label: Cómo lo ejecutas
      description: El modo de ejecución que reproduce el defecto.
      options:
        - Docker Compose
        - Procesos locales (sin Docker)
        - Producción
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Sistema operativo y arquitectura.
      placeholder: "macOS 15 arm64"
    validations:
      required: true

  - type: input
    id: revision-base
    attributes:
      label: Revisión de la base de datos
      description: Salida de `alembic current` dentro de `backend/`. Las discrepancias de esquema aparecen aquí primero.
      placeholder: "0029 (head)"
    validations:
      required: false

  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones
      options:
        - label: Se buscó en los issues existentes y este no está duplicado.
          required: true
        - label: Los secretos, tokens y hostnames privados están redactados en la evidencia.
          required: true
