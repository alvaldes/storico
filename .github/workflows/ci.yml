name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are wasted work for a pure test gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test gates only need to read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src tests

      - name: Check formatting (ruff format)
        working-directory: backend
        run: ruff format --check src tests

      - name: Test (pytest)
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version is pinned in frontend/package.json's `packageManager`
      # field, so it must be read from there rather than passed as `version`.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # The hook rules are the class of bug that put ExportPanel on production
      # rendering nothing (early return above three useMemo calls, see the
      # post-merge incident in odd/tasks/export-page-rework.md): 941 tests,
      # tsc and the build were all green on a component that mounted to null.
      # The config is deliberately narrow — react-hooks/rules-of-hooks as an
      # error and exhaustive-deps as a warning — so a style sweep can never
      # give this step a reason to be removed.
      - name: Lint (react-hooks rules — the gate for the hooks-order incident class)
        working-directory: frontend
        run: pnpm run lint

      - name: Test (vitest)
        working-directory: frontend
        run: pnpm vitest run

      # The build is the artifact Vercel serves, and no job compiled it until
      # this step existed: `tsc` type-checks and `vitest` tests, but neither runs
      # `astro build`, so a pull request could merge with a build Vercel would
      # refuse. Every prior verification ran `pnpm run build` by hand, which made
      # this a convention rather than a gate. It needs no environment: the
      # frontend's config module is evaluated per request, not at build time.
      - name: Build (astro build)
        working-directory: frontend
        run: pnpm build
