name: Deploy backend to Oracle VM

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# A deploy swaps a container *and* applies migrations. Two at once would race on
# both, so they queue instead of cancelling each other: cancelling a deploy in the
# middle of a migration is worse than waiting for the one ahead of it. `ci.yml`
# cancels superseded runs because it only reads the repository; this one writes to
# production.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== Pull latest code ==="
            cd /home/ubuntu/storico
            git fetch origin main
            git reset --hard origin/main

            echo "=== Keep the current image as a rollback tag ==="
            # The build below overwrites the only tag the previous release had, so
            # without this step there is no way back at all. See docs/deployment.md
            # for when restoring this tag is safe and when the path is forward.
            #
            # Deliberately an `if` and not `docker tag ... || echo`: a missing image on
            # the first deploy is the one tolerated case, and any other `docker tag`
            # failure has to reach `set -e`. A trailing `|| echo` here is the same
            # shape as the `|| echo OK` that made a broken deploy report success for
            # a day, and it would hide a missing rollback image as well.
            if docker image inspect storico-api >/dev/null 2>&1; then
              docker tag storico-api storico-api:previous
            else
              echo "no image tagged storico-api yet (first deploy)"
            fi

            echo "=== Rebuild Docker image ==="
            docker build -t storico-api -f backend/Dockerfile backend/

            echo "=== Stop & remove old container ==="
            docker stop storico-api 2>/dev/null || true
            docker rm storico-api 2>/dev/null || true

            echo "=== Apply migrations (maintenance window) ==="
            # This window -- old container stopped, new one not started yet -- is
            # the only position that satisfies every revision's ordering
            # instruction, and that is why it cannot move above the stop. 0022 and
            # 0024 require the new code to be live before they run, because an old
            # release misreads the new schema; 0023 requires the column to exist
            # before the new code selects it. Each hazard needs a release on the
            # wrong side, so having no release live removes both at once.
            #
            # It runs from the image just built, since the revision being applied is
            # the one in this commit, and with the same env file as the container, so
            # the migration cannot reach a different database than the app. That file
            # carries STORICO_DATABASE_URL and STORICO_ENCRYPTION_KEY, and every
            # upgrade crossing 0024 needs the key.
            #
            # `upgrade head` is a no-op on a database already at head, so this is safe
            # on every deploy. `set -e` aborts the job on failure, which leaves the
            # API down rather than serving a schema the code does not match: that is
            # the deliberate trade, and the alternative is the 2026-09-20 outage.
            # Recovery is forward -- fix the cause, re-run this workflow. Re-running is
            # safe for the two revisions that rewrite existing data rather than only
            # adding structure: 0022 and 0024 carry idempotence guards for it
            # (odd/tasks/schema-drift-gate.md). The rest are additive.
            #
            # Bounded on purpose: a migration that hangs on a lock or a stalled
            # connection would otherwise hold the API down for as long as the job
            # lives. The chain's runtime is seconds when it has anything to do at all,
            # so 900s is a ceiling only a hang reaches. `-k 30` is the part that
            # matters: without it `timeout` sends SIGTERM and then waits forever for a
            # child that ignores it. The container is unnamed, so a killed CLI cannot
            # leave a name collision with the serving container.
            timeout -k 30 900 docker run --rm \
              --network host \
              --env-file /home/ubuntu/storico/backend/.env \
              storico-api \
              alembic upgrade head

            echo "=== Start new container ==="
            docker run -d \
              --name storico-api \
              --restart unless-stopped \
              --network host \
              --env-file /home/ubuntu/storico/backend/.env \
              storico-api

            echo "=== Verify production is ready ==="
            # The previous check was `curl ... && echo OK || echo FAILED`. The
            # `||` made the compound command's status the one from `echo`, so
            # it exited 0 no matter what: a deploy that left production down
            # reported success, which is how the 2026-09-20 outage survived a
            # day. Every check below is a plain command, and `set -e` at the
            # top of this script aborts on the first non-zero status. That
            # status reaches the job because drone-ssh exits non-zero when
            # the remote script does -- it reports through log.Fatal, so a
            # remote `exit 3` arrives here as 1. Non-zero propagation is all
            # this gate needs. The action's `script_stop` input was declared
            # through v1.2.0 and is gone from v1.2.1 on; the v1 README says
            # to add `set -e` at the top of the script instead.
            #
            # Readiness means the database answers AND `alembic_version`
            # equals the code's head, so this gate is strict on purpose. The
            # container needs seconds to boot (engine init, startup recovery),
            # so one sleep plus one curl would flake; poll a bounded window
            # and report how long it actually took.
            READY_URL=http://localhost:8000/api/v1/health/ready
            READY_TIMEOUT_SECONDS=120
            ready=0
            attempts=0
            started_at=$(date +%s)

            while [ "$attempts" -lt "$READY_TIMEOUT_SECONDS" ]; do
              attempts=$((attempts + 1))
              if ! docker inspect -f '{{.State.Running}}' \
                   storico-api 2>/dev/null | grep -q true; then
                sleep 1
                continue
              fi
              if curl -sf -o /dev/null "$READY_URL"; then
                ready=1
                break
              fi
              sleep 1
            done

            elapsed_seconds=$(( $(date +%s) - started_at ))

            if [ "$ready" -eq 1 ]; then
              echo "Ready after ${elapsed_seconds}s: container running,"
              echo "${READY_URL} answered 2xx."
            else
              echo "=== READINESS GATE FAILED: ${elapsed_seconds}s ==="
              container_running=$(docker inspect \
                -f '{{.State.Running}}' storico-api 2>/dev/null \
                || echo "container not found")
              echo "storico-api container running: ${container_running}"
              response=$(curl -s -w '\n%{http_code}' "$READY_URL" \
                2>/dev/null || true)
              echo "HTTP status: $(printf '%s' "$response" | tail -n 1)"
              echo "Response body:"
              printf '%s' "$response" | sed '$d'
              echo
              echo "Schema status logged by the container:"
              docker logs storico-api 2>&1 \
                | grep "Schema status is" \
                | tail -n 3 || true
              echo "Last 20 container log lines:"
              docker logs --tail 20 storico-api 2>&1 || true
              echo
              echo "This red gate means something different from the one it"
              echo "replaced: the migration step above already ran and reported"
              echo "success, so the schema"
              echo "is not the suspect. Readiness requires the database to"
              echo "answer AND alembic_version to equal the head packaged with"
              echo "this code, so a red result here points at the container or"
              echo "its environment -- it did not start, it cannot reach the"
              echo "database, or the STORICO_* variables differ between the"
              echo "migration env file and the app's."
              echo 'Runbook -- docs/deployment.md, "Migraciones": the exact'
              echo "commands, the forward recovery path, and the rollback tag the"
              echo "previous deploy left as storico-api:previous -- safe only while"
              echo "the schema still fits that code; with a half-applied migration"
              echo "the path is forward, not back."
              exit 1
            fi
